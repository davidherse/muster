# Historical projects used to evaluate estimator accuracy.
# plan: PDF path(s); baseline: CSV of the job's human estimate and actuals.
# escalation_factor converts the job's cost base to mid-2026 dollars; the eval
# deflates AI totals by it before comparing.
# questionnaire mirrors the in-app clarification form (scope facts only).
# The first four jobs seeded the price book; huxham/rosalie/carson are held out.
hilda:
  plan: "/Users/davidherse/Dropbox/Built Homes/esitmates/Hilda - Approved plans 0892_CAMPBELL_BA_03_FOR_CONSTRUC.pdf"
  baseline: eval/baselines/hilda.csv
  escalation_factor: 1.29
  prompt: >
    Ballpark build cost, Brisbane (Enoggera), 2026. Renovation and extension of an
    existing dwelling into a double-storey home, reworked largely within the existing
    footprint, ~280 m2 across two levels (confirm against plans), on a 390 m2 lot -
    new lower level (garage, extra bedrooms, rumpus/MPR, bathroom, laundry/bar) under
    a renovated upper level. The existing roof is retained. New carport, decks, front
    fence with balustrade and screening. Demolition of old bathrooms, stairs and driveway.
  questionnaire:
    finish_level: High-end
    repaint_extent: New work plus touch-ups (retained areas untouched)
    duration_months: "11"
    building_era: Pre-1946 character home
    asbestos: None present
    structural_work: [ "Build-in-under", "New slab or extension footprint" ]
    systems_extras: [ "Ducted A/C", "Fireplace" ]
    external_works: [ "Boundary fencing", "Pergola / carport" ]
    services_scope: Partial upgrade plus new work
    exclusions: Pool excluded (by others).

constitution:
  plan: "/Users/davidherse/Dropbox/Built Homes/esitmates/Constitution - Certified Architectural - 36 Constitution.pdf"
  baseline: eval/baselines/constitution.csv
  escalation_factor: 1.10
  prompt: >
    Ballpark build cost, Brisbane (Windsor), 2026. Renovation of an existing
    two-storey home, ~400 m2 across two levels (confirm against plans). Existing
    structure retained; new framing over the additions only. New poolside pergola.
    Large amount of glazing, custom joinery and stone, skylights, character
    balustrade/fretwork. Demolition, some slope. Allow for latent conditions
    (concealed damage, out-of-square framing, rewiring surprises) typical when
    opening up a house of this age.
  questionnaire:
    finish_level: High-end
    repaint_extent: Full repaint inside and out, incl. retained linings (VJ, trim, fretwork)
    duration_months: "14"
    building_era: Pre-1946 character home
    asbestos: Present — removal required
    structural_work: [ "Existing pool retained", "New slab or extension footprint" ]
    site_conditions: [ "Sloped block" ]
    systems_extras: [ "Ducted A/C", "Solar PV", "Home battery", "Plantation shutters" ]
    services_scope: Partial upgrade plus new work

